<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Your Itinerary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="itinerary.css">
</head>

<body>
  <header class="page-header" id="page-header">
    <h1>Your Itinerary for <span id="castle-name">Castle Name</span></h1>
  </header>

  <main class="page-content">
    <section class="info-card">
      <img id="castle-image" class="castle-img hidden" src="" alt="">
      <p><strong>Price: <span id="castle-price">--</span></strong></p>
      <p><strong>Number of travelers:</strong>
        <select id="visitor-count">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </p>

      <p><strong>Bus departure time:</strong> <span id="departure-time">--</span></p>
      <p><strong>Bus return time:</strong> <span id="return-time">--</span></p>

      <h4>OUTBOUND JOURNEY:</h4>
      <ul id="outbound-journey"></ul>

      <h4>Walking directions to castle:</h4>
      <ul id="walking-directions"></ul>

      <h4>RETURN JOURNEY to Newcastle:</h4>
      <ul id="return-journey"></ul>

      <h4>Useful Tips:</h4>
      <ul id="tips"></ul>

      <div style="text-align: center; margin-top: 30px;">
        <a id="confirm-link" href="#"
          class="confirm-button">Confirm Payment</a>
      </div>
    </section>
  </main>

  <script src="itinerary.js"></script>
</body>
<script>
  // 获取URL参数
  const urlParams = new URLSearchParams(window.location.search);
  const selectedCastle = urlParams.get('castle');
  const departureTime = urlParams.get('time');
  const visitorNumber = urlParams.get('visitors');

  // 检查是否获取到参数
  console.log(selectedCastle, departureTime, visitorNumber);

  // 使用这些参数更新页面内容
  document.getElementById('castle-name').textContent = selectedCastle.charAt(0).toUpperCase() + selectedCastle.slice(1);
  document.getElementById('departure-time').textContent = departureTime;
  document.getElementById('visitor-count').value = visitorNumber;

  // 更新确认链接
  const confirmLink = document.getElementById('confirm-link');
  confirmLink.href = `confirmation.html?castle=${selectedCastle}&time=${departureTime}&visitors=${visitorNumber}&total=${totalCost.toFixed(2)}`;
</script>

</html>
