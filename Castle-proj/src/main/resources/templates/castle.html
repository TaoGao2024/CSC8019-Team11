<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Castle Information</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="itinerary.css">
  <style>
   body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: 100vh;
  }
      
    .page-header {
    background-color: rgba(4, 58, 6, 0.8);
    padding: 20px 30px;
    color: white;
}

    .header-bar {
    display: flex;
    align-items: center;
    grid-gap: 24px;
    flex-wrap: wrap;
}

  .back-button {
    padding: 3px 10px;
    background-color: white;
    color: rgba(4, 58, 6, 0.8);
    border: none;
    border-radius: 6px;
    font-size: 15px;
    text-decoration: none;
    font-weight: bold;
    margin-right: 40px;
    cursor: pointer;

  }

  .back-button:hover {
    background-color: #e6e6e6;
  }
      
    .page-header h1 {
  font-size: 24px;
  margin: 0;
}

  @media screen and (max-width: 768px) {
    .header-bar {
    flex-direction: row;
    justify-content: flex-start;
    grid-gap: 12px;
    flex-wrap: wrap;
  }

  .page-header h1 {
    font-size: 20px;
  }

  .back-button {
    font-size: 14px;
    padding: 6px 12px;
  }
  }

  </style>
</head>
<body>
  

  <header class="page-header">
   <div class="header-bar">
   <a href="/" class="back-button">← Back</a>
    <h1>Welcome to <span id="castle-name">Castle Name</span></h1>
      </div>
  </header>

  <main class="page-content">
    <section class="info-card">
      <p id="castle-description"></p>
      <p><strong>Official Website:</strong> <a id="castle-link" href="#" target="_blank">Visit Site</a></p>
      <h4>Highlights:</h4>
      <ul id="castle-highlights"></ul>
    </section>
  </main>

  <script src="castle.js"></script>
</body>
</html>
