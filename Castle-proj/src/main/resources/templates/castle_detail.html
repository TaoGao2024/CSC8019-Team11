<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Castle Detail</title>
</head>
<body>
<h1>Castle Information</h1>

<div th:if="${castle != null}">
    <h2 th:text="${castle.name}">Castle Name</h2>
    <p><strong>Castle ID:</strong> <span th:text="${castle.castleId}">ID</span></p>
    <p><strong>Description:</strong> <span th:text="${castle.description}">Description</span></p>
    <p><strong>Entry Fee:</strong> £<span th:text="${castle.entryFee}">0.00</span></p>
</div>

<div th:if="${castle == null}">
    <p>Castle not found!</p>
</div>

<a href="/">Back to Home</a>
</body>
</html>
