<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Itinerary</title>
    <link rel="stylesheet" href="/css/routeSelection.css">
</head>
<body>
<header class="page-header">
    <div class="header-bar">
        <a href="/" class="back-button">← Back</a>
        <h1>Itinerary</h1>
    </div>
</header>

<main class="page-content">
    <div th:unless="${#lists.isEmpty(roundTripList)}" th:each="trip : ${roundTripList}" class="trip-card">
        <div class="trip-table">
            <div class="trip-header">
                <div>Newcastle</div>
                <div class="arrow">⇆</div>
                <div th:text="${castleName + ' Castle'}" class="no-wrap-text"></div>
            </div>
            <div class="trip-row">
                <div th:text="'Depart: ' + ${trip.outboundSchedule?.departTime}"></div>
                <div></div>
                <div th:text="'Arrive: ' + ${trip.outboundSchedule?.arriveTime}"></div>
            </div>
            <div class="trip-row">
                <div th:text="'Arrive: ' + ${trip.returnSchedule?.arriveTime}"></div>
                <div></div>
                <div th:text="'Return: ' + ${trip.returnSchedule?.departTime}"></div>
            </div>
        </div>
        <div class="trip-price">
            Total Price: <span th:text="${trip.totalPrice}"></span>
        </div>
        <a th:href="@{/itinerary(outboundId=${trip.outboundSchedule.scheduleId}, returnId=${trip.returnSchedule.scheduleId}, castleName=${castleName}, noOfVisitors=${noOfVisitors}, totalPrice=${trip.totalPrice})}">View Details</a>
    </div>
</main>
</body>
</html>
